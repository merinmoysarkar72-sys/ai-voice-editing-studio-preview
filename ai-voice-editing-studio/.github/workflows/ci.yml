name: AI Voice Editing Studio CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: python -m pip install fastapi pydantic uvicorn python-multipart python-docx pypdf pytest httpx
      - name: Run automated tests
        run: pytest -q
      - name: Check Python syntax
        run: python -m compileall -q backend/app tests
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -f backend/Dockerfile -t ai-voice-editing-studio:test .
